[package]
name = "nest-engine"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
description = "Nest2D nesting engine: separation/compaction optimizer built on jagua-rs + sparrow"

[lib]
name = "nest_engine"
path = "src/lib.rs"

[[bin]]
name = "nest-engine"
path = "src/main.rs"

[dependencies]
sparrow = { path = "../sparrow" }
jagua-rs = { workspace = true, features = ["spp", "bpp"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
clap = { workspace = true }
libm = { workspace = true }
num_cpus = "1.17"

# Controle NEGATIF du verrou de gonflement (lot E0) : le test rejoue le
# chemin primaire de jagua (geo_buffer seul) pour prouver qu'il MEURT sur la
# fixture. Sans ce controle, le verrou passerait meme si le repli ne servait
# a rien. Uniquement en test, jamais dans le binaire livre.
[dev-dependencies]
geo-buffer = "0.2"
geo-types = "0.7"

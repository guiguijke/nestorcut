name: Build and publish Docker images

# Builds the main app and the 3 worker images and pushes them to the GitHub
# Container Registry (ghcr.io) under the repository owner's namespace.
#
# TAGS (lot D1, 2026-09-13) :
#   - :<git-sha>     immuable, epinglee sur le commit exact
#   - :main          mutable, le dernier build de main (pratique pour voir
#                    ce qui est construit, JAMAIS tire par la prod)
#
# `:latest` N'EST PLUS DEPLACE PAR CE WORKFLOW. Il designe ce qui a recu un
# GO, et seul le workflow manuel « promote-latest » l'y deplace. Avant ce
# lot, une simple poussee sur main deplacait `:latest`, si bien qu'un
# `docker compose pull` sur la prod ou le homelab pouvait deployer des lots
# SANS GO (constat du 2026-09-13 : `:latest` designait J1 et le lot 2d alors
# que la prod tournait un SHA anterieur approuve).
#
# Deployer, cote serveur :
#   docker compose pull && docker compose up -d          # tire le :latest promu
#
# Notes:
#  - The nesting worker builds the nest-engine Rust workspace (workers/nesting/engine),
#    no external submodule required.
#  - The legacy strip workers were removed with the 2026-09 repository
#    re-creation; their ghcr images remain for the running stacks.

on:
  push:
    branches:
      - "main"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  tests:
    name: nest-engine + worker tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workers/nesting

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.88.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            workers/nesting/engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('workers/nesting/engine/Cargo.lock') }}

      - name: Build nest-engine
        run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Rust tests
        run: cargo test --release --manifest-path engine/Cargo.toml

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        # worker_common (workers/common) holds the shared plumbing imported by
        # all workers; both requirement sets pin the same pymongo, so they can
        # be installed together without the old grep workaround.
        run: |
          pip install -e ../common
          pip install -r requirements.txt pytest==8.3.5
          pip install -r ../fileprocessing/requirements.txt

      - name: Worker tests (unit + integration with the real engine)
        env:
          NEST_ENGINE_BIN: ${{ github.workspace }}/workers/nesting/engine/target/release/nest-engine
        run: python -m pytest tests/ -m "not slow" -q

  build-and-push:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: tests
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      # Worker images build with ./workers as context so they can COPY the
      # shared common/ package (worker_common) into the image.
      matrix:
        include:
          - image: nest2d-app
            context: .
            file: ./Dockerfile
          - image: nest2d-admin
            context: ./admin
            file: ./admin/Dockerfile
          - image: nest2d-user-file-processing-worker
            context: ./workers
            file: ./workers/fileprocessing/Dockerfile
          - image: nest2d-nesting-worker
            context: ./workers
            file: ./workers/nesting/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        # The GHA cache backend requires the docker-container buildx driver,
        # not the default 'docker' driver.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase image owner
        id: owner
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: echo "name=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # Host + homelab are amd64 — keep the whole matrix explicit.
          platforms: linux/amd64
          # `:latest` est ABSENT d'ici par decision du lot D1 : il ne bouge
          # que par « promote-latest », sur un SHA qui a recu un GO.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:main
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

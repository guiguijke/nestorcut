# Verrous de la géométrie Rust partagée (workers/geometry — mission v2).
# Déclenché sur toute PR touchant le workspace : tests unitaires, parité
# Python↔Rust sur le corpus commité (seuil ≥ 99 % post-snap, PIPELINE-MAP
# §4.1), déterminisme natif↔wasm (SHA-256, tolérance 0). Échec = merge bloqué.
name: geometry-locks

on:
  pull_request:
    paths:
      - "workers/geometry/**"
      - ".github/workflows/geometry-locks.yml"
  push:
    branches: [main]
    paths:
      - "workers/geometry/**"

permissions:
  contents: read

jobs:
  cargo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: workers/geometry
      - name: cargo test
        working-directory: workers/geometry
        run: cargo test --release

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: workers/geometry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build CLI natif
        working-directory: workers/geometry
        run: cargo build --release
      - name: Harnais de parité (goldens commités, stdlib only)
        # compare.py ne lit que les goldens JSON commités + le CLI Rust :
        # pas besoin d'ezdxf/shapely en CI (la régénération des goldens
        # reste un acte local, relu en review).
        run: python workers/geometry/parity/compare.py workers/geometry/parity/golden workers/geometry/parity/corpus_extra

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: workers/geometry
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.0"
      - name: Build CLI natif
        working-directory: workers/geometry
        run: cargo build --release
      - name: Build wasm + glue wasm-bindgen (version épinglée au Cargo.lock, J-063)
        working-directory: workers/geometry
        run: |
          WB_VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          echo "wasm-bindgen crate = $WB_VERSION"
          cargo build --release -p nest-import -p nest-preprocess \
            --target wasm32-unknown-unknown --features wasm,svg
          cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
          wasm-bindgen --target web --out-dir target/wasm-pkg \
            target/wasm32-unknown-unknown/release/nest_import.wasm
          wasm-bindgen --target web --out-dir target/wasm-pkg-pp \
            target/wasm32-unknown-unknown/release/nest_preprocess.wasm
      - name: Verrou déterminisme natif↔wasm (tolérance 0)
        run: node workers/geometry/parity/determinism_lock.mjs

  exports-parity:
    # PR3 : DXF sémantique (parse ezdxf des 2 sorties), SVG coloré
    # byte-level (SHA-256), rapport valeurs — goldens depuis le Python réel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: workers/geometry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Dépendances Python (ezdxf, shapely, svgelements)
        run: pip install ezdxf==1.4.4 shapely==2.0.7 svgelements==1.9.6 numpy==2.1.3
      - name: Build CLI natifs
        working-directory: workers/geometry
        run: cargo build --release -p nest-export -p nest-report
      - name: Harnais de parité exports (3 régimes)
        run: python workers/geometry/parity/exports_check.py

  client-server-diff:
    # PR4 : le bundle WASM (chemin navigateur) doit produire les mêmes
    # artefacts que le serveur Python — SVG byte-level, rapport 1e-6,
    # import identique au golden. Échec = merge bloqué (risque n°1 mission).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: workers/geometry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.0"
      - name: Dépendances Python
        run: pip install ezdxf==1.4.4 shapely==2.0.7 svgelements==1.9.6 numpy==2.1.3
      - name: Build bundle géométrie wasm (wasm-bindgen épinglé J-063)
        working-directory: workers/geometry
        run: |
          WB_VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
          bash build-wasm.sh
      - name: Diff client/serveur (wasm vs Python)
        run: python workers/geometry/parity/client_server_diff.py

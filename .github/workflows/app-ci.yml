# CI du code applicatif JS/Nuxt (complète geometry-locks.yml qui ne couvre que
# workers/geometry). Pas de secret requis : vitest (tests server mockés) puis
# build Nuxt (les artefacts wasm/public sont commités, aucune variable d'env
# n'est nécessaire pour compiler).
name: app-ci

on:
  pull_request:
    paths:
      - "app/**"
      - "server/**"
      - "shared/**"
      - "admin/**"
      - "package.json"
      - "package-lock.json"
      # `vitest.config.js` décide COMMENT les tests tournent : l'exclure des
      # déclencheurs, c'est ne jamais tester le correctif qui les répare
      # (constat du 2026-09-10 : le correctif esbuild ne déclenchait pas CI).
      - "vitest.config.js"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "shared/**"
      - "admin/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.js"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.0"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Tests server (vitest, db mockée)
        run: npx vitest run
      - name: Build Nuxt
        run: npm run build

  admin:
    # A-10 : le panneau admin (admin/, app Nuxt séparée) était déclenché par
    # le filtre `paths` mais jamais compilé ici ; un build cassé n'apparaissait
    # qu'au build d'image.
    # Construit dans une copie isolée, comme le contexte Docker (admin/ seul) :
    # dans le dépôt, le tsconfig.json racine (include **/*.vue) capte aussi les
    # fichiers de l'admin et exige un .nuxt racine absent de ce job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.0"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - name: Isolate admin (Docker build context)
        run: cp -r admin "$RUNNER_TEMP/admin"
      - name: Install
        working-directory: ${{ runner.temp }}/admin
        run: npm ci
      - name: Build Nuxt admin
        working-directory: ${{ runner.temp }}/admin
        run: npm run build
